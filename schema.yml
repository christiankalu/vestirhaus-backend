components:
  schemas:
    AudienceEnum:
      enum:
      - men
      - women
      - kids
      - unisex
      type: string
      description: |-
        * `men` - Men
        * `women` - Women
        * `kids` - Kids
        * `unisex` - Unisex
    CategoryTree:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          oneOf:
          - type: string
            maxLength: 150
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        description:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        parent:
          type: string
          readOnly: true
        children:
          type: array
          items: {}
          readOnly: true
      required:
      - children
      - id
      - name
      - parent
    CategoryWrite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          oneOf:
          - type: string
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        description:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        parent:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    CustomLogin:
      type: object
      description: Require email confirmation before issuing customer JWTs.
      properties:
        username:
          type: string
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        password:
          type: string
      required:
      - password
    CustomRegister:
      type: object
      description: Registration serializer that creates customer accounts only.
      properties:
        email:
          type: string
          format: email
        password1:
          type: string
          writeOnly: true
        password2:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 30
        address:
          type: string
          maxLength: 255
      required:
      - email
      - password1
      - password2
    LogoutSchema:
      type: object
      properties:
        refresh:
          type: string
          description: The refresh token to blacklist.
      required:
      - refresh
    PaginatedCategoryTreeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
