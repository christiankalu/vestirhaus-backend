          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryWrite'
          description: ''
  /api/categories/{slug}/:
    get:
