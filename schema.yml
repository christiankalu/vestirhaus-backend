          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryWrite'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryWrite'
          description: ''
    delete:
      operationId: categories_destroy
      description: Public category tree with admin-only catalogue management.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
