      properties:
        rating:
          type: integer
          maximum: 5
          minimum: 1
        title:
          type: string
          maxLength: 150
        body:
          type: string
      required:
      - body
      - rating
      - title
    ReviewRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reviewer_name:
          type: string
          readOnly: true
        rating:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        is_verified_purchase:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - is_verified_purchase
      - rating
      - reviewer_name
      - title
    RoleEnum:
      enum:
      - customer
      - admin
      - vendor
      type: string
      description: |-
        * `customer` - Customer
        * `admin` - Admin
        * `vendor` - Vendor
    SizeEnum:
      enum:
      - XS
      - S
      - M
      - L
      - XL
      - XXL
      - Custom
      type: string
      description: |-
        * `XS` - XS
        * `S` - S
        * `M` - M
        * `L` - L
        * `XL` - XL
        * `XXL` - XXL
        * `Custom` - Custom
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    UserAddress:
      type: object
      description: Serialize a customer's saved addresses without exposing ownership
        control.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 50
        recipient_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 30
        address_line_1:
          type: string
          maxLength: 255
        address_line_2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 100
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_line_1
      - city
      - created_at
      - id
      - phone_number
      - recipient_name
      - state
      - updated_at
      - user
    UserDetails:
      type: object
      description: Expose safe profile fields while keeping security fields read-only.
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 30
        address:
          type: string
          maxLength: 255
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - is_verified
      - pk
      - role
    VerifyEmail:
      type: object
      properties:
        key:
          type: string
          writeOnly: true
      required:
      - key
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
