  /api/products/:
    get:
      operationId: products_list
      description: Public read-only catalogue; admin-only product mutations.
      parameters:
      - in: query
        name: audience
        schema:
          type: string
          enum:
          - kids
          - men
          - unisex
          - women
        description: |-
          * `men` - Men
          * `women` - Women
          * `kids` - Kids
          * `unisex` - Unisex
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: color
        schema:
          type: string
      - in: query
        name: in_stock
        schema:
          type: boolean
      - in: query
        name: max_price
        schema:
          type: number
        description: Maximum effective price in kobo.
      - in: query
        name: min_price
        schema:
          type: number
        description: Minimum effective price in kobo.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: size
        schema:
          type: string
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - newest
          - popularity
          - price_asc
          - price_desc
        description: Catalogue sort option.
      tags:
      - products
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
    post:
      operationId: products_create
      description: Public read-only catalogue; admin-only product mutations.
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
